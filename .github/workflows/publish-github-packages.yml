name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Pacotes a publicar (ex: packages/api-reference ou vazio para todos)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (with GitHub Packages registry)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Packages
        run: pnpm build:packages

      - name: Prepare Package Scopes for GitHub Packages
        run: node scripts/prepare-github-packages.mjs
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Publish to GitHub Packages
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            echo "Publishing specific package: ${{ inputs.packages }}"
            cd ${{ inputs.packages }}
            pnpm publish --no-git-checks --registry https://npm.pkg.github.com
          else
            echo "Publishing all packages in workspace..."
            pnpm -r publish --no-git-checks --registry https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update GitHub Release with Standalone Bundle
        run: |
          STANDALONE_FILE="packages/api-reference/dist/browser/standalone.js"
          STANDALONE_MAP="packages/api-reference/dist/browser/standalone.js.map"

          if [ -f "$STANDALONE_FILE" ]; then
            echo "Uploading standalone bundle to GitHub Releases (latest)..."
            gh release create latest "$STANDALONE_FILE" "$STANDALONE_MAP" \
              --title "Scalar Standalone Latest Build" \
              --notes "Standalone browser bundle for direct CDN / FastAPI / HTML integration." \
              --clobber || true

            if [[ "${{ github.ref_name }}" == v* ]]; then
              echo "Uploading standalone bundle to release ${{ github.ref_name }}..."
              gh release create "${{ github.ref_name }}" "$STANDALONE_FILE" "$STANDALONE_MAP" \
                --title "Release ${{ github.ref_name }}" \
                --notes "Automated release for ${{ github.ref_name }}" \
                --clobber || true
            fi
          else
            echo "Standalone bundle not found at $STANDALONE_FILE"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
